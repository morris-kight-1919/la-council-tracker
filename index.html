026_Communication_s_from_Public_f5532173.txt", "ai_summary": false}, {"type": "document", "cfnumber": "26-0588", "title": "26-0588 \u2014 06182026 Community Impact Statement submitted by Historic Highland Pa", "snippet": "clerk CIS <clerk.cis@lacity.org> Your Community Impact Statement Submittal - Council File Number: 26-0588 1 message LA City SNow <cityoflaprod@service-now.com> Thu, Jun 18, 2026 at 2:49 PM Reply-To: LA City SNow <cityoflaprod@service-now.com> To: Clerk.CIS@lacity.org, darren@therosegrp.com A Neighborhood Council Community Impact Statement (CIS) has been successfully submitted to your Commission or", "link": "documents/26-0588/06182026_Community_Impact_Statement_submitted_by_Historic_Highland_Pa_75965482.txt", "ai_summary": false}, {"type": "transcript", "cfnumber": null, "title": "Meeting 15255 transcript (4918 segments)", "snippet": "We're a beacon of hope. >> Los Angeles [music] recognizes the history, resilience, achievements, and ongoing contributions of LGBTQIA+ Angelinos and reaffirms its commitment to keeping Los Angeles a city where everyone can live openly with pride. The city of Los Angeles has [music] designated significant historic and cultural sites. And during June, it honors and [music] uplifts LGBTQIA plus community members, talents, and leaders who continue to inspire. >> Welcome, welcome, welcome to the People's House. Happy Pride Month, Los Angeles. For generations, LGBTQ people were told that spaces like this weren't built for us. And yet, here we are. Queers, not only in the room, but taking over it.", "link": "transcripts/15255.json"}, {"type": "transcript", "cfnumber": null, "title": "Meeting 17722 transcript (2416 segments)", "snippet": "We built an amazing transportation line here and I'm excited to be part of it. What a way to kick off Asian-American, Native Hawaiian, and [music] Pacific Islander Heritage Month. My parents were immigrants from Taiwan and um coming over here they kind of vowed to give um my older brother and I opportunities that they never had. They always loved sports. My dad loved basketball. Um my mom loved track and field. Never had the opportunity opportunity to do that. And so when we when we were here, my brother and I really were given the the opportunity chance to pursue sports, which which was an absolute passion of [music] mine. and to be able to take it um all the way to the Olympic stage. Um it's just been a dream dream life. It's truly an honor to", "link": "transcripts/17722.json"}, {"type": "transcript", "cfnumber": null, "title": "Meeting 17723 transcript (3507 segments)", "snippet": "for friends and family to do. Guests should definitely register on Eventbrite so that they can solidify their position. However, on the day of the event, folks can also come to Union Station, scan a QR code, and register there. The event is free for the public, so anybody can come to the event as long as they register on Eventbrite. >> There's a total of 18 parks that will be hosting these events. So, we have Kenneth Hahn Regional and Harbor and South LA we have Alondra Park. On the Westside we have Cheviot Hills, in the Valley we have Whitsett. Come kick it with Recreation and Parks. >> Well, it's the only app built by Metro for Metro riders. So, you have a lot of options, a lot of great apps out there, but this is the only one where we're", "link": "transcripts/17723.json"}, {"type": "transcript", "cfnumber": null, "title": "Meeting 17724 transcript (3369 segments)", "snippet": "People do pack some sort of go kit [music] which includes their medications, identifying information of their pets if they have them in case they're separated. If you live in an apartment building, please make yourself aware of where the fire extinguishers are in your building. Uh [music] please make sure you keep your fire alarms functioning, which also monitor for gas, and you know, reach out to your landlord to ask them to engage in safety [music] measures for the entire building, which also might lower their insurance cost if they engage safely on how to protect themselves. All these things are [music] what we're here to teach today in a way that hopefully people can deal with in an affordable", "link": "transcripts/17724.json"}, {"type": "transcript", "cfnumber": null, "title": "Meeting 17750 transcript (3083 segments)", "snippet": "make parks, the more people are getting out and getting to meet their neighbors &gt;&gt; and the safer the places become because there's more eyes in the parks on our children, on our kids. So I believe in making sure that it's multi-generational &gt;&gt; and it's also a busy environment. &gt;&gt; Uh so we're expanding soccer fields. We're uh we've already opened two different parks in the area to make sure that there's a lot of activity going on &gt;&gt; uh inside the parks. We're turning small patches into pocket parks so that it's a place for folks to be able to congregate uh and get engaged. Uh I want to make sure we have enough you know chest tables so that some of our more aging our senior members uh can get together and congregate in parks and so that that way the park also becomes", "link": "transcripts/17750.json"}, {"type": "transcript", "cfnumber": null, "title": "Meeting 17801 transcript (6498 segments)", "snippet": "I'm really excited. I got to celebrate with my friends. >> So, we wanted to come out, make a sign because we're so proud that here we found ourselves in this time in our lives to be together. I've always imagined that it will actually look like this and I'm really excited that I'm finally here and I get to immersely experience it. I hope that I can continue to do it the years to come. This is the way we're telling the world. It's never too late, right? I'm 84, she's 80. We just wanted to be together. We're always trying to find ways to connect with each other. And pride is a day of happiness. It's a day of celebration. It's celebrating authenticity and representation. You", "link": "transcripts/17801.json"}, {"type": "transcript", "cfnumber": null, "title": "Meeting 18005 transcript (2483 segments)", "snippet": "schools and ensuring every child in Los Angeles gets the best possible start in life. I was born and raised here in LA and I began my career as an English teacher at Markham Middle School in Watts. At Markham, I coached the baseball and soccer teams and helped my students launch a school newspaper. It was as a teacher that I saw firsthand how poor leadership and structural inequities harm my students. When budget cuts led to twothirds of our teachers being laid off, including myself, I fought to rehire quality teachers and join the ACLU. former Mayor Dick Reirden, then Mayor Antonio Viraosa, and others to bring a groundbreaking civil rights lawsuit to protect my students. Inspired to push for broader change, I went to law school, and I went on to", "link": "transcripts/18005.json"}, {"type": "transcript", "cfnumber": null, "title": "Meeting 18006 transcript (3791 segments)", "snippet": "doctors and teachers and nurses and we need to be out here supporting them and making sure they are accepted and that we stand with them. >> We see you. We hear you. We're here to fight alongside with you. Pride is not just this month and this day, but we're here to fight for [music] the rights of every single person and the dignity of all people. LA is for all. I'm extraordinarily [music] proud and grateful that this is going on and that I can be a part of it. >> We all have each other's backs. [music] Um, and we are in fact a community and we're not going to let them divide and conquer us. We're a united front. >> It takes things like pride to remind everyone of how far we've come, but how much farther we still have to go. We've", "link": "transcripts/18006.json"}, {"type": "transcript", "cfnumber": null, "title": "Meeting 18157 transcript (3030 segments)", "snippet": "sitting in the trucks and getting [music] to see how those work. I really just couldn't be more impressed about how much there is to learn. All the freebies, all the activities, the food, and just the [music] fun that we had. It was very entertaining and very informative as well. Do not litter. All this trash that we see out there doesn't magically come from outer space. us human beings [music] bought it and dropped it. We get off the bus and we know exactly what to do. All through the year, we're going to schools. We have an environmental education program about the impact of trash on the streets and when it rains, trash goes down to the storm drain and impacts the beaches and oceans. So", "link": "transcripts/18157.json"}, {"type": "transcript", "cfnumber": null, "title": "Meeting 18309 transcript (6268 segments)", "snippet": "All 19 team matches will be broadcast at Union Station. This is the only free location in all of Los Angeles that will be hosting a fan zone where fans can come to see the FIFA broadcast shown both in Spanish and English. And we're showing it throughout Union Station, both in the fan zone and on a 76 ft LED screen inside the waiting room. The fan zone will be fully interactive with a lot of different things for friends and family to do. Guests should definitely register on Eventbrite so that they can solidify their position. However, on the day of the event, folks can also come to Union Station, scan a QR code and register there. The event is free for the public, so anybody can come to the event as long as they register on Eventbrite.", "link": "transcripts/18309.json"}, {"type": "transcript", "cfnumber": null, "title": "Meeting 18322 transcript (11941 segments)", "snippet": "been doing this for 20 years. It's so nice to see the [music] kids how they enjoy seeing the drivers that actually collect their trash. I've watched the [music] kids come and they hug their drivers and they're take pictures with them. It's really enjoyable to see. We have children that have been coming here for 20 years, if not longer. And some of those children [mu const q = document.getElementById('q');
const results = document.getElementById('results');
const count = document.getElementById('count');

function render(filtered) {
  count.textContent = filtered.length + ' result(s)';
  results.innerHTML = filtered.slice(0, 200).map(e => `
    <div class="entry">
      <div class="type">${e.type}${e.ai_summary ? '<span class="badge">AI summary</span>' : ''}</div>
      <div class="title"><a href="${e.link}" target="_blank">${e.title}</a></div>
      <div class="snippet">${e.snippet}</div>
    </div>
  `).join('');
}

function search() {
  const term = q.value.toLowerCase().trim();
  if (!term) { render(DATA); return; }
  const filtered = DATA.filter(e =>
    (e.title && e.title.toLowerCase().includes(term)) ||
    (e.snippet && e.snippet.toLowerCase().includes(term))
  );
  render(filtered);
}

q.addEventListener('input', search);
render(DATA);
</script>
